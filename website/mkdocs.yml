{
  "site_name": "WasserMan documentation",
  "site_description": "WasserMan: Benchmark for Underwater Manipulation Policy Learning",
  "site_url": "https://dancher00.github.io/wasserman/docs/",
  "docs_dir": ".publication/docs",
  "site_dir": "dist/docs",
  "theme": {
    "name": "material",
    "logo": "assets/wasserman-logo.png",
    "favicon": "assets/wasserman-logo.png",
    "font": false,
    "palette": [
      {
        "scheme": "default",
        "toggle": {
          "icon": "material/weather-night",
          "name": "Switch to dark theme"
        }
      },
      {
        "scheme": "slate",
        "toggle": {
          "icon": "material/weather-sunny",
          "name": "Switch to light theme"
        }
      }
    ],
